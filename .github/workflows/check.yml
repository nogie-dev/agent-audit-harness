name: offline-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install uv
        run: python3 -m pip install uv==0.12.5
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.1'
          cache: false
      - name: Install locked environment
        run: make setup
      - name: Prepare pinned Go extractor dependencies
        run: make setup-go
      - name: Prepare pinned Solidity compiler
        run: make setup-solidity
      - name: Prepare hash-locked Semgrep CE
        run: make setup-static
      - name: Lint, format and tests
        run: make check
      - name: Replay workflow
        run: make demo
      - name: Compiler call structure
        run: make demo-graph
      - name: Go call structure
        run: make demo-go
      - name: Python call structure
        run: make demo-python
      - name: Go graph, recon and relationship-based replay
        run: make demo-review
      - name: Bounded agent evidence requests and resume
        run: make demo-investigation
      - name: Solidity call structure
        run: make demo-solidity
      - name: Static evidence, bounded replay and resume
        run: make demo-static
      - name: Source-backed model proposals, second static pass and resume
        run: make demo-models
      - name: Source-backed recon proposals, investigation priority and resume
        run: make demo-recon
      - name: Independent candidate intake and retained static omissions
        run: make demo-intake
      - name: Recorded PoC proposals, resume and synthetic operator review
        run: make demo-poc
      - name: Frozen build matrix and preserved missing runs
        run: make demo-matrix
      - name: Offline labeled replay comparison
        run: make demo-benchmark
      - name: Multi-language model evaluation preflight
        run: make demo-model-evaluation
